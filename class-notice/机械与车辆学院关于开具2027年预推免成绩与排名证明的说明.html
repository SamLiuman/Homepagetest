<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机械与车辆学院关于开具2027年预推免成绩与排名证明的说明</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
            line-height: 1.85;
            color: #333;
            background-color: #f7f8fa;
            padding: 40px 20px;
        }
        .document-container {
            max-width: 920px;
            margin: 0 auto;
            background: #ffffff;
            padding: 60px 70px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
            border-radius: 6px;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            line-height: 1.7;
            margin-bottom: 45px;
            color: #1a1a1a;
            font-weight: 600;
        }
        h2 {
            font-size: 20px;
            margin: 32px 0 16px;
            color: #1a1a1a;
            border-left: 4px solid #165DFF;
            padding-left: 12px;
            font-weight: 600;
        }
        h3 {
            font-size: 18px;
            margin: 22px 0 12px;
            color: #222;
            font-weight: 600;
        }
        p {
            margin-bottom: 10px;
            text-indent: 2em;
            font-size: 16px;
        }
        .no-indent {
            text-indent: 0;
        }
        ol {
            margin-left: 2.2em;
            margin-bottom: 15px;
        }
        ol li {
            margin-bottom: 9px;
            font-size: 16px;
        }
        /* 公式样式 */
        .formula-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 24px 0;
            font-size: 16px;
        }
        .fraction {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .fraction-top, .fraction-bottom {
            padding: 5px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fraction-top {
            border-bottom: 1px solid #333;
        }
        .sigma {
            font-size: 30px;
            line-height: 1;
        }
        .sigma-limits {
            display: flex;
            flex-direction: column;
            font-size: 12px;
            line-height: 1.1;
            text-align: center;
        }
        sub {
            font-size: 0.85em;
        }
        .formula-desc {
            margin-top: 8px;
        }
        /* 页脚落款 */
        .footer-sign {
            margin-top: 60px;
            text-align: right;
        }
        .footer-sign p {
            text-indent: 0;
            margin-bottom: 6px;
            font-size: 16px;
        }
        a {
            color: #165DFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .document-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 20px;
            }
            h2 {
                font-size: 18px;
            }
        }
    </style>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="document-container">
        <h1>机械与车辆学院关于开具2027年预推免成绩与排名证明的说明</h1>

        <p>根据教务部工作安排，机械与车辆学院目前无法开具与推免证明、推免成绩排名。</p>
	<p>何时能开具需要等教务部通知，教务部通知下来后会第一时间通知到各位同学。</p>
        <p>请各位同学耐心等候，不必再发邮件咨询。</p>

        <div class="footer-sign">
            <p>2317班学习事务部行政长官 学习委员</p>
            <p>2026年8月17日</p>
        </div>
    </div>
</body>
</html>
