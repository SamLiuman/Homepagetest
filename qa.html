<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学业答疑 · IronEgg</title>
    <meta name="description" content="IronEgg 学业答疑：任何人都可以提问，任何人都可以回答，无需登录。">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --brand: #6c5ce7;
            --brand-dark: #5b4bc4;
            --ink: #2f3341;
            --ink-2: #555b6b;
            --ink-3: #949aa8;
            --line: #eceef3;
            --bg-soft: #faf9ff;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 44px 20px 60px;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        .wrap { max-width: 860px; margin: 0 auto; }

        /* ---------- 顶部 ---------- */
        .topbar { text-align: center; color: #fff; margin-bottom: 26px; }
        .topbar h1 { font-size: 32px; font-weight: 600; letter-spacing: 1px; }
        .topbar p { font-size: 15px; opacity: .92; margin-top: 8px; }
        .topbar .pills { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .pill {
            font-size: 12px; padding: 4px 12px; border-radius: 999px;
            background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35);
            color: #fff; backdrop-filter: blur(4px);
        }

        /* ---------- 通用卡片 ---------- */
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
        }

        /* ---------- 模式提示条 ---------- */
        .mode-bar {
            display: none;
            align-items: flex-start;
            gap: 10px;
            padding: 13px 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            background: #fffaf0;
            border: 1px solid #ffe2b8;
            color: #8a5a00;
            font-size: 13px;
            line-height: 1.7;
        }
        .mode-bar.show { display: flex; }
        .mode-bar b { color: #6b4500; }
        .mode-bar .close {
            margin-left: auto; cursor: pointer; border: none; background: none;
            color: #b98a35; font-size: 16px; line-height: 1; padding: 2px 4px; flex-shrink: 0;
        }

        /* ---------- 提问区 ---------- */
        .composer { padding: 22px 24px 20px; margin-bottom: 22px; }
        .composer-head {
            display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
        }
        .composer-head .tag {
            font-size: 12px; font-weight: 600; color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 3px 10px; border-radius: 999px;
        }
        .composer-head .sub { font-size: 13px; color: var(--ink-3); }

        .field {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.7;
            color: var(--ink);
            background: #fcfcfe;
            resize: vertical;
            transition: border-color .18s, box-shadow .18s, background .18s;
        }
        .field::placeholder { color: #b6bbc7; }
        .field:focus {
            outline: none;
            border-color: #b9b1f5;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(108,92,231,.12);
        }
        #q-input { min-height: 96px; }

        .composer-foot {
            display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap;
        }
        .author-input {
            flex: 1 1 200px;
            min-width: 150px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 13px;
            font-family: inherit;
            font-size: 14px;
            color: var(--ink);
            background: #fcfcfe;
            transition: border-color .18s, box-shadow .18s;
        }
        .author-input:focus {
            outline: none; border-color: #b9b1f5; box-shadow: 0 0 0 3px rgba(108,92,231,.12);
        }
        .counter { font-size: 12px; color: var(--ink-3); margin-left: auto; font-variant-numeric: tabular-nums; }
        .counter.warn { color: #e0663a; }

        .btn {
            border: none; border-radius: 10px; cursor: pointer;
            font-family: inherit; font-size: 14px; font-weight: 600;
            padding: 10px 22px;
            transition: transform .15s, box-shadow .15s, opacity .15s;
        }
        .btn-primary {
            color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 4px 14px rgba(108,92,231,.32);
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(108,92,231,.42); }
        .btn-primary:active:not(:disabled) { transform: translateY(0); }
        .btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }

        /* ---------- 工具栏 ---------- */
        .toolbar {
            display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
        }
        .tabs {
            display: flex; gap: 4px; padding: 4px;
            background: rgba(255,255,255,.16);
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 11px;
        }
        .tab {
            border: none; background: none; cursor: pointer;
            font-family: inherit; font-size: 13.5px;
            color: rgba(255,255,255,.85);
            padding: 7px 15px; border-radius: 8px;
            transition: background .18s, color .18s;
        }
        .tab:hover { color: #fff; background: rgba(255,255,255,.14); }
        .tab.active { background: #fff; color: var(--brand-dark); font-weight: 600; }

        .search {
            flex: 1 1 180px; min-width: 150px;
            border: 1px solid rgba(255,255,255,.35);
            background: rgba(255,255,255,.16);
            color: #fff;
            border-radius: 10px;
            padding: 9px 14px;
            font-family: inherit; font-size: 13.5px;
            transition: background .18s, border-color .18s;
        }
        .search::placeholder { color: rgba(255,255,255,.7); }
        .search:focus { outline: none; background: rgba(255,255,255,.26); border-color: rgba(255,255,255,.6); }

        /* ---------- 问题列表 ---------- */
        .list { display: flex; flex-direction: column; gap: 14px; }

        .q-card { padding: 20px 22px 16px; }

        .q-head { display: flex; align-items: center; gap: 11px; margin-bottom: 11px; }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 14px; font-weight: 600; letter-spacing: .5px;
        }
        .q-meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
        .q-author {
            font-size: 13.5px; font-weight: 600; color: var(--ink-2);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px;
        }
        .q-time { font-size: 12px; color: var(--ink-3); }

        .q-body {
            font-size: 15.5px; line-height: 1.8; color: var(--ink);
            white-space: pre-wrap; word-break: break-word;
        }

        .q-actions {
            display: flex; align-items: center; gap: 8px;
            margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
        }
        .link-btn {
            border: none; background: none; cursor: pointer;
            font-family: inherit; font-size: 13.5px;
            color: var(--brand); padding: 6px 10px; border-radius: 8px;
            display: inline-flex; align-items: center; gap: 5px;
            transition: background .15s;
        }
        .link-btn:hover { background: var(--bg-soft); }
        .link-btn.answered { color: #14915f; }

        .del-btn {
            margin-left: auto; border: none; background: none; cursor: pointer;
            color: #c8ccd6; font-size: 13px; padding: 6px 8px; border-radius: 8px;
            transition: color .15s, background .15s;
        }
        .del-btn:hover { color: #e0533d; background: #fff2ef; }

        /* ---------- 回答区 ---------- */
        .answers { display: none; margin-top: 4px; }
        .answers.open { display: block; }

        .a-item {
            margin-top: 12px; padding: 12px 14px;
            background: var(--bg-soft);
            border-left: 3px solid #d9d4fb;
            border-radius: 0 10px 10px 0;
        }
        .a-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .a-author { font-size: 13px; font-weight: 600; color: var(--brand-dark); }
        .a-time { font-size: 11.5px; color: var(--ink-3); }
        .a-body {
            font-size: 14.5px; line-height: 1.78; color: var(--ink-2);
            white-space: pre-wrap; word-break: break-word;
        }
        .a-del {
            margin-left: auto; border: none; background: none; cursor: pointer;
            color: #ccd0da; font-size: 12px; padding: 2px 6px; border-radius: 6px;
        }
        .a-del:hover { color: #e0533d; background: #fff2ef; }

        .no-answer {
            margin-top: 12px; font-size: 13px; color: var(--ink-3);
            padding: 10px 2px;
        }

        .a-composer { margin-top: 14px; padding-top: 14px; border-top: 1px dashed #e4e1f7; }
        .a-composer .field { min-height: 68px; font-size: 14.5px; background: #fff; }
        .a-foot { display: flex; align-items: center; gap: 10px; margin-top: 9px; flex-wrap: wrap; }
        .a-foot .author-input { flex: 0 1 170px; padding: 8px 12px; font-size: 13.5px; }
        .a-foot .btn { padding: 8px 18px; font-size: 13.5px; margin-left: auto; }

        /* ---------- 图片：选择区 ---------- */
        .img-bar { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .img-pick {
            border: 1px dashed #cfcaf5; background: var(--bg-soft); color: var(--brand-dark);
            border-radius: 10px; padding: 9px 15px; font-size: 13.5px; cursor: pointer;
            font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
            transition: background .15s, border-color .15s;
        }
        .img-pick:hover:not(:disabled) { background: #f1edff; border-color: #b9b1f5; }
        .img-pick:disabled { opacity: .5; cursor: not-allowed; }
        .img-tip { font-size: 12px; color: var(--ink-3); line-height: 1.6; flex: 1 1 160px; }

        .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .thumbs:empty { display: none; }
        .thumb {
            position: relative; width: 78px; height: 78px; border-radius: 10px;
            overflow: hidden; border: 1px solid var(--line); background: #f3f4f8;
            animation: pop .18s ease-out;
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb .x {
            position: absolute; top: 3px; right: 3px; width: 19px; height: 19px;
            border: none; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff;
            font-size: 11px; line-height: 1; cursor: pointer; padding: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .thumb .x:hover { background: #e0533d; }
        .thumb.uploading img { filter: blur(1px) brightness(.85); }
        .thumb.uploading::after {
            content: ""; position: absolute; inset: 0; margin: auto;
            width: 18px; height: 18px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
            animation: spin .8s linear infinite;
        }

        .drop-over { outline: 3px dashed #b9b1f5; outline-offset: -8px; }

        /* ---------- 图片：卡片内展示 ---------- */
        .q-imgs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 11px; }
        .q-imgs img {
            width: 134px; height: 134px; object-fit: cover; border-radius: 10px;
            border: 1px solid var(--line); cursor: zoom-in; display: block;
            transition: transform .15s, box-shadow .15s;
        }
        .q-imgs img:hover { transform: scale(1.02); box-shadow: 0 6px 18px rgba(0,0,0,.14); }
        .a-imgs { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
        .a-imgs img {
            width: 92px; height: 92px; object-fit: cover; border-radius: 8px;
            border: 1px solid #e2ddf8; cursor: zoom-in; display: block;
        }
        .a-imgs img:hover { box-shadow: 0 4px 14px rgba(0,0,0,.13); }

        /* ---------- 图片：大图查看 ---------- */
        .lightbox {
            display: none; position: fixed; inset: 0; z-index: 80;
            background: rgba(16,14,28,.9); backdrop-filter: blur(4px);
            align-items: center; justify-content: center; padding: 26px;
        }
        .lightbox.show { display: flex; }
        .lightbox img {
            max-width: 100%; max-height: 100%; border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }
        .lightbox .lb-close {
            position: absolute; top: 16px; right: 20px;
            width: 40px; height: 40px; border: none; border-radius: 50%;
            background: rgba(255,255,255,.14); color: #fff; font-size: 20px;
            cursor: pointer; line-height: 1;
        }
        .lightbox .lb-close:hover { background: rgba(255,255,255,.28); }

        /* ---------- 空状态 / 加载 ---------- */
        .empty {
            text-align: center; padding: 54px 24px; color: var(--ink-3);
            background: rgba(255,255,255,.94); border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.12);
        }
        .empty .ico { font-size: 40px; margin-bottom: 14px; opacity: .85; }
        .empty .t { font-size: 15px; color: var(--ink-2); margin-bottom: 6px; font-weight: 600; }
        .empty .s { font-size: 13.5px; line-height: 1.7; }

        .loading { text-align: center; padding: 36px; color: rgba(255,255,255,.92); font-size: 14px; }
        .spinner {
            display: inline-block; width: 20px; height: 20px; margin-bottom: 10px;
            border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
            border-radius: 50%; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-box {
            padding: 14px 16px; border-radius: 12px; margin-bottom: 14px;
            background: #fff2ef; border: 1px solid #ffd6cc; color: #b3402a;
            font-size: 13.5px; line-height: 1.7;
        }

        /* ---------- 页脚 ---------- */
        .footer {
            margin-top: 30px; text-align: center; color: rgba(255,255,255,.82); font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap;
        }
        .footer a { color: #fff; text-decoration: none; opacity: .85; }
        .footer a:hover { opacity: 1; text-decoration: underline; }
        .admin-entry {
            border: none; background: none; cursor: pointer; font-family: inherit;
            color: rgba(255,255,255,.62); font-size: 12.5px; text-decoration: underline;
            text-underline-offset: 3px; padding: 0;
        }
        .admin-entry:hover { color: #fff; }

        /* ---------- 口令弹窗 ---------- */
        .mask {
            display: none; position: fixed; inset: 0; z-index: 50;
            background: rgba(30,28,48,.5); backdrop-filter: blur(3px);
            align-items: center; justify-content: center; padding: 20px;
        }
        .mask.show { display: flex; }
        .modal {
            background: #fff; border-radius: 16px; padding: 26px 26px 22px;
            width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
            animation: pop .18s ease-out;
        }
        @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h3 { font-size: 17px; margin-bottom: 8px; color: var(--ink); }
        .modal p { font-size: 13px; color: var(--ink-3); line-height: 1.7; margin-bottom: 16px; }
        .modal .field { margin-bottom: 14px; }
        .modal-foot { display: flex; gap: 10px; justify-content: flex-end; }
        .btn-ghost {
            background: #f3f4f8; color: var(--ink-2);
        }
        .btn-ghost:hover { background: #eaecf3; }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 20px);
            background: #2f3341; color: #fff; font-size: 14px;
            padding: 12px 22px; border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,.28);
            opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s;
            z-index: 60; max-width: 82vw;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        .toast.err { background: #c0392b; }

        .admin-flag {
            display: none; margin-bottom: 14px; padding: 9px 14px;
            background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.4);
            border-radius: 10px; color: #fff; font-size: 13px;
            align-items: center; gap: 10px;
        }
        .admin-flag.show { display: flex; }
        .admin-flag button {
            margin-left: auto; border: none; background: rgba(255,255,255,.2);
            color: #fff; cursor: pointer; font-family: inherit; font-size: 12.5px;
            padding: 4px 11px; border-radius: 7px;
        }
        .admin-flag button:hover { background: rgba(255,255,255,.32); }

        @media (max-width: 600px) {
            body { padding: 30px 14px 46px; }
            .topbar h1 { font-size: 25px; }
            .topbar p { font-size: 13.5px; }
            .composer { padding: 18px 16px 16px; }
            .q-card { padding: 17px 16px 13px; }
            .q-body { font-size: 15px; }
            .counter { margin-left: 0; width: 100%; text-align: right; }
            .a-foot .author-input { flex: 1 1 100%; }
            .a-foot .btn { margin-left: 0; width: 100%; }
            .footer { gap: 12px; }
        }
    </style>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <h1>学业答疑</h1>
        <p>IronEgg 服务平台 · 有人问，就有人答</p>
        <div class="pills">
            <span class="pill">🔓 无需登录</span>
            <span class="pill">💬 人人可提问</span>
            <span class="pill">🙋 人人可回答</span>
            <span class="pill">⚡ 发完即显示</span>
        </div>
    </div>

    <!-- 未配置云后端时的提示 -->
    <div class="mode-bar" id="mode-bar">
        <span>⚠️</span>
        <div>
            <b>当前是本地演示模式</b>：内容只保存在你这台浏览器里，别人看不到。
            站主按 <code>qa-setup.sql</code> 建好库、把地址和密钥填进页面顶部配置后，所有人即可共享同一个答疑板。
        </div>
        <button class="close" id="mode-close" title="知道了">✕</button>
    </div>

    <div class="admin-flag" id="admin-flag">
        <span>🛡️ 站长模式已开启，可以删除任意提问与回答</span>
        <button id="admin-exit">退出</button>
    </div>

    <!-- 提问区 -->
    <section class="card composer" id="composer">
        <div class="composer-head">
            <span class="tag">我要提问</span>
            <span class="sub">学业、选课、升学、科研、竞赛……问什么都行</span>
        </div>
        <textarea id="q-input" class="field" maxlength="1000"
                  placeholder="把问题写清楚一点，别人和站主才答得准。比如：&#10;“大三下想补一门数值分析，和现在的专业课时间冲突，有什么替代方案吗？”&#10;&#10;题目是拍照的？直接 Ctrl+V 粘贴截图，或拖图片进来。"></textarea>

        <div id="img-slot"></div>

        <div class="composer-foot">
            <input id="q-author" class="author-input" maxlength="20"
                   placeholder="昵称（选填，留空就是匿名同学）">
            <span class="counter" id="q-count">0 / 1000</span>
            <button class="btn btn-primary" id="q-submit">发布提问</button>
        </div>
    </section>

    <!-- 筛选 -->
    <div class="toolbar">
        <div class="tabs" id="tabs">
            <button class="tab active" data-filter="all">全部</button>
            <button class="tab" data-filter="unanswered">待回答</button>
            <button class="tab" data-filter="answered">已解答</button>
        </div>
        <input class="search" id="search" placeholder="搜索问题或回答…">
    </div>

    <div id="error-box"></div>
    <div id="list" class="list"></div>
    <div id="loading" class="loading" hidden>
        <div class="spinner"></div>
        <div>正在加载答疑内容…</div>
    </div>
    <div id="empty" class="empty" hidden>
        <div class="ico">🌱</div>
        <div class="t" id="empty-title">还没有人提问</div>
        <div class="s" id="empty-sub">第一条问题就交给你了。</div>
    </div>

    <div class="footer">
        <a href="index.html">← 返回主页</a>
        <a href="hotline.html">站主热线</a>
        <button class="admin-entry" id="admin-entry">站长入口</button>
    </div>
</div>

<!-- 口令弹窗 -->
<div class="mask" id="mask">
    <div class="modal">
        <h3>站长模式</h3>
        <p>输入站长口令后可删除任意提问与回答。口令只在服务端校验，页面源码里看不到。</p>
        <input class="field" type="password" id="pass-input" placeholder="请输入站长口令" autocomplete="off">
        <div class="modal-foot">
            <button class="btn btn-ghost" id="pass-cancel">取消</button>
            <button class="btn btn-primary" id="pass-ok">进入</button>
        </div>
    </div>
</div>

<div class="lightbox" id="lightbox">
    <button class="lb-close" id="lb-close" title="关闭">✕</button>
    <img id="lb-img" alt="">
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   学业答疑 · 前端
   -------------------------------------------------------------------------
   两种数据模式（改下面 QA_CONFIG.backend 即可切换）：

   1) 'local'    —— 零配置，数据存在 localStorage，只有本机能看见。
                    用于本地预览 / 验收，或纯个人留言本。
   2) 'supabase' —— 跨用户共享。填 supabaseUrl 与 supabaseAnonKey 两个值就行。
                    建库脚本见同目录 qa-setup.sql。

   安全模型（重要）：
   · 提问、回答 —— 任何人（匿名）都能写，前端用 anon key 直连。
   · 删除       —— 数据库里【没有任何】update / delete 策略，anon key 删不掉任何东西。
                    只有 qa_delete_question() 这个 security definer 函数能删，
                    而它会在服务端比对口令。所以"只有站主能删"是数据库层面保证的，
                    不是靠前端藏按钮。
   ========================================================================= */

const QA_CONFIG = {
    backend: 'local',            // ← 改成 'supabase' 并填下面两项即可上线
    supabaseUrl: '',             // 例：https://abcdefghijk.supabase.co
    supabaseAnonKey: '',         // Supabase → Project Settings → API → anon public

    adminPass: 'iron-qa-2026',   // 仅 local 模式使用；supabase 模式用 SQL 里的口令
    maxLen: 1000,                // 单条字数上限
    rateLimitMs: 4000,           // 两次发布的最小间隔（防刷屏，可设 0 关闭）

    // —— 图片 ——
    maxImages: 3,                // 每条最多几张图
    imageMaxDim: 1400,           // 压缩后最长边（px）
    imageQuality: 0.72,          // JPEG 质量 0~1
    storageBucket: 'qa-images'   // Supabase Storage 桶名（见 qa-setup.sql）
};

/* ========================= 工具函数 ========================= */

const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
}

function uid() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
    }
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function fmtTime(ts) {
    const diff = Date.now() - ts;
    if (diff < 0) return '刚刚';
    if (diff < 60 * 1000) return '刚刚';
    if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + ' 分钟前';
    if (diff < 24 * 60 * 60 * 1000) return Math.floor(diff / 3600000) + ' 小时前';
    if (diff < 7 * 24 * 60 * 60 * 1000) return Math.floor(diff / 86400000) + ' 天前';
    const d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function avatarColor(name) {
    const palette = [
        'linear-gradient(135deg,#667eea,#764ba2)',
        'linear-gradient(135deg,#4facfe,#00c6fb)',
        'linear-gradient(135deg,#43e97b,#38b2ac)',
        'linear-gradient(135deg,#fa709a,#f093fb)',
        'linear-gradient(135deg,#f6a623,#f76b1c)',
        'linear-gradient(135deg,#8e2de2,#4a00e0)'
    ];
    let h = 0;
    const s = String(name || '匿名同学');
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return palette[h % palette.length];
}

function cleanAuthor(raw) {
    const v = String(raw || '').trim().slice(0, 20);
    return v || '匿名同学';
}

let toastTimer = null;
function toast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast' + (isError ? ' err' : ''); }, 2600);
}

function showError(msg) {
    $('error-box').innerHTML = '';
    if (!msg) return;
    $('error-box').appendChild(el('div', 'error-box', msg));
}

/* ========================= 图片处理 ========================= */

/**
 * 压缩图片：等比缩放到最长边 maxDim，再转成 JPEG。
 * 手机原图常有 3~5MB，压完一般 80~200KB，既省流量也避免撑爆存储。
 * @returns {Promise<{dataUrl:string, w:number, h:number}>}
 */
function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
        if (!file || !file.type || !file.type.startsWith('image/')) {
            reject(new Error('这不是图片文件'));
            return;
        }

        const reader = new FileReader();
        reader.onerror = () => reject(new Error('读取图片失败'));
        reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error('图片解码失败（格式可能不受支持）'));
            img.onload = () => {
                let w = img.naturalWidth || img.width;
                let h = img.naturalHeight || img.height;
                if (!w || !h) { reject(new Error('图片尺寸异常')); return; }

                const scale = Math.min(1, maxDim / Math.max(w, h));
                w = Math.max(1, Math.round(w * scale));
                h = Math.max(1, Math.round(h * scale));

                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');

                // 白底：透明 PNG（截图常见）转 JPEG 后不会变黑
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0, w, h);

                let out;
                try {
                    out = canvas.toDataURL('image/jpeg', quality);
                } catch (e) {
                    reject(new Error('图片处理失败'));
                    return;
                }
                resolve({ dataUrl: out, w, h });
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    });
}

/** dataURL → Blob（上传到 Supabase Storage 用） */
function dataUrlToBlob(dataUrl) {
    const parts = String(dataUrl).split(',');
    const mimeMatch = parts[0].match(/:(.*?);/);
    const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    const bin = atob(parts[1]);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
}

/** 图片点击放大 */
function openLightbox(src) {
    $('lb-img').src = src;
    $('lightbox').classList.add('show');
}

function closeLightbox() {
    $('lightbox').classList.remove('show');
    $('lb-img').src = '';
}

/** 把一组图片 URL 渲染成可点击的图片墙 */
function buildImageGrid(urls, cls) {
    const box = el('div', cls);
    (urls || []).forEach(src => {
        const img = el('img');
        img.src = src;
        img.alt = '随附图片';
        img.loading = 'lazy';
        img.addEventListener('click', () => openLightbox(src));
        box.appendChild(img);
    });
    return box;
}

/**
 * 通用图片选择器（提问框、回答框共用）
 * opts = {
 *   max      最多几张
 *   compact  紧凑样式（回答框用）
 *   getList  返回"活的"数组，内部直接增删
 *   onChange 内容变化回调
 * }
 * 返回 { el, draw, addFiles }
 */
function createPicker(opts) {
    const wrap = el('div');

    const bar = el('div', 'img-bar');
    const btn = el('button', 'img-pick');
    btn.type = 'button';
    btn.textContent = opts.compact ? '📷 配图' : '📷 添加图片';

    const tip = el('span', 'img-tip',
        opts.compact ? '' : '可直接 Ctrl+V 粘贴截图，或把图片拖进来；自动压缩');
    const count = el('span', 'counter');

    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = true;
    input.hidden = true;

    const thumbs = el('div', 'thumbs');

    bar.appendChild(btn);
    bar.appendChild(tip);
    bar.appendChild(count);
    wrap.appendChild(bar);
    wrap.appendChild(thumbs);
    wrap.appendChild(input);

    function draw() {
        const list = opts.getList() || [];
        thumbs.innerHTML = '';
        list.forEach(item => {
            const t = el('div', 'thumb');
            const im = el('img');
            im.src = item.dataUrl;
            im.alt = '待上传图片';

            const x = el('button', 'x', '✕');
            x.type = 'button';
            x.title = '移除这张图';
            x.addEventListener('click', () => {
                const arr = opts.getList();
                const i = arr.findIndex(z => z.id === item.id);
                if (i >= 0) arr.splice(i, 1);
                opts.onChange();
                draw();
            });

            t.appendChild(im);
            t.appendChild(x);
            thumbs.appendChild(t);
        });
        count.textContent = list.length + ' / ' + opts.max;
        btn.disabled = list.length >= opts.max;
        input.disabled = list.length >= opts.max;
    }

    async function addFiles(files) {
        const list = opts.getList() || [];
        const room = opts.max - list.length;
        if (room <= 0) {
            toast('最多 ' + opts.max + ' 张图片', true);
            return;
        }

        const picked = Array.prototype.slice.call(files)
            .filter(f => f && f.type && f.type.indexOf('image/') === 0)
            .slice(0, room);

        if (!picked.length) return;

        let failed = 0;
        for (const f of picked) {
            try {
                const r = await compressImage(f, QA_CONFIG.imageMaxDim, QA_CONFIG.imageQuality);
                opts.getList().push({ id: uid(), dataUrl: r.dataUrl });
                opts.onChange();
                draw();
            } catch (e) {
                failed++;
            }
        }
        if (failed) toast(failed + ' 张图片处理失败，请换一张试试', true);
    }

    btn.addEventListener('click', () => input.click());
    input.addEventListener('change', () => {
        addFiles(input.files);
        input.value = '';
    });

    draw();
    return { el: wrap, draw, addFiles };
}

/* ========================= 后端 1：本地模式 ========================= */

const LocalAPI = {
    KEY: 'iron_qa_v1',
    _mem: null,   // localStorage 不可用时的兜底
    _warned: false,

    _read() {
        try {
            const raw = localStorage.getItem(this.KEY);
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            return this._mem || [];
        }
    },

    _write(data) {
        this._mem = data;
        try {
            localStorage.setItem(this.KEY, JSON.stringify(data));
            return true;
        } catch (e) {
            // 配额满（通常是本地模式下囤了太多图片）：本次会话仍能看到，
            // 但刷新后会丢，必须让用户知道，不能静默失败。
            if (!this._warned) {
                this._warned = true;
                setTimeout(function () {
                    toast('本地存储已满：图片太多，刷新后可能丢失。建议改用云端模式，或删掉一些旧帖。', true);
                }, 60);
            }
            return false;
        }
    },

    async list() {
        return this._read().sort((a, b) => b.createdAt - a.createdAt);
    },

    async addQuestion({ content, author, images }) {
        const data = this._read();
        data.push({
            id: uid(), content, author, images: images || [],
            createdAt: Date.now(), answers: []
        });
        this._write(data);
    },

    async addAnswer({ questionId, content, author, images }) {
        const data = this._read();
        const q = data.find(x => x.id === questionId);
        if (!q) throw new Error('这条提问已不存在');
        if (!Array.isArray(q.answers)) q.answers = [];
        q.answers.push({
            id: uid(), content, author, images: images || [],
            createdAt: Date.now()
        });
        this._write(data);
    },

    async deleteQuestion(id, pass) {
        if (pass !== QA_CONFIG.adminPass) return false;
        this._write(this._read().filter(x => x.id !== id));
        return true;
    },

    async deleteAnswer(questionId, answerId, pass) {
        if (pass !== QA_CONFIG.adminPass) return false;
        const data = this._read();
        const q = data.find(x => x.id === questionId);
        if (!q || !Array.isArray(q.answers)) return false;
        q.answers = q.answers.filter(a => a.id !== answerId);
        this._write(data);
        return true;
    },

    async verifyPass(pass) {
        return pass === QA_CONFIG.adminPass;
    }
};

/* ========================= 后端 2：Supabase ========================= */

const SupaAPI = {
    _base() { return String(QA_CONFIG.supabaseUrl).replace(/\/+$/, ''); },

    _headers() {
        const k = QA_CONFIG.supabaseAnonKey;
        return {
            'apikey': k,
            'Authorization': 'Bearer ' + k,
            'Content-Type': 'application/json'
        };
    },

    async _check(res, what) {
        if (!res.ok) {
            let detail = '';
            try { detail = (await res.text()).slice(0, 200); } catch (e) {}
            throw new Error(what + '失败（HTTP ' + res.status + '）' + (detail ? '：' + detail : ''));
        }
        return res;
    },

    async list() {
        const url = this._base() + '/rest/v1/qa_questions'
            + '?select=id,content,author,images,created_at,qa_answers(id,content,author,images,created_at)'
            + '&order=created_at.desc';
        const res = await this._check(await fetch(url, { headers: this._headers() }), '读取');
        const rows = await res.json();
        return rows.map(r => ({
            id: r.id,
            content: r.content,
            author: r.author || '匿名同学',
            images: r.images || [],
            createdAt: new Date(r.created_at).getTime(),
            answers: (r.qa_answers || [])
                .map(a => ({
                    id: a.id,
                    content: a.content,
                    author: a.author || '匿名同学',
                    images: a.images || [],
                    createdAt: new Date(a.created_at).getTime()
                }))
                .sort((x, y) => x.createdAt - y.createdAt)
        }));
    },

    /** 把压缩后的 dataURL 逐张上传到 Storage，返回公开 URL 数组 */
    async uploadImages(dataUrls) {
        const out = [];
        for (const dataUrl of dataUrls) {
            const blob = dataUrlToBlob(dataUrl);
            const name = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
            const path = this._base() + '/storage/v1/object/'
                + QA_CONFIG.storageBucket + '/' + name;

            const res = await fetch(path, {
                method: 'POST',
                headers: {
                    'apikey': QA_CONFIG.supabaseAnonKey,
                    'Authorization': 'Bearer ' + QA_CONFIG.supabaseAnonKey,
                    'Content-Type': 'image/jpeg',
                    'x-upsert': 'false',
                    'cache-control': '31536000'
                },
                body: blob
            });
            await this._check(res, '图片上传');

            out.push(this._base() + '/storage/v1/object/public/'
                + QA_CONFIG.storageBucket + '/' + name);
        }
        return out;
    },

    async addQuestion({ content, author, images }) {
        const res = await fetch(this._base() + '/rest/v1/qa_questions', {
            method: 'POST',
            headers: Object.assign({ 'Prefer': 'return=minimal' }, this._headers()),
            body: JSON.stringify({ content, author, images: images || [] })
        });
        await this._check(res, '发布提问');
    },

    async addAnswer({ questionId, content, author, images }) {
        const res = await fetch(this._base() + '/rest/v1/qa_answers', {
            method: 'POST',
            headers: Object.assign({ 'Prefer': 'return=minimal' }, this._headers()),
            body: JSON.stringify({
                question_id: questionId, content, author, images: images || []
            })
        });
        await this._check(res, '发布回答');
    },

    async deleteQuestion(id, pass) {
        const res = await fetch(this._base() + '/rest/v1/rpc/qa_delete_question', {
            method: 'POST',
            headers: this._headers(),
            body: JSON.stringify({ target: id, p_pass: pass })
        });
        if (!res.ok) return false;
        return (await res.json()) === true;
    },

    async deleteAnswer(questionId, answerId, pass) {
        const res = await fetch(this._base() + '/rest/v1/rpc/qa_delete_answer', {
            method: 'POST',
            headers: this._headers(),
            body: JSON.stringify({ target: answerId, p_pass: pass })
        });
        if (!res.ok) return false;
        return (await res.json()) === true;
    },

    async verifyPass(pass) {
        // 用一个不存在的 uuid 试删：能通过口令校验就会返回 true（什么都不会被删）
        const probe = '00000000-0000-0000-0000-000000000000';
        const res = await fetch(this._base() + '/rest/v1/rpc/qa_delete_question', {
            method: 'POST',
            headers: this._headers(),
            body: JSON.stringify({ target: probe, p_pass: pass })
        });
        if (!res.ok) return false;
        return (await res.json()) === true;
    }
};

/* ========================= 选后端 ========================= */

const useCloud = QA_CONFIG.backend === 'supabase'
    && /^https?:\/\//.test(QA_CONFIG.supabaseUrl)
    && QA_CONFIG.supabaseAnonKey.length > 20;

const API = useCloud ? SupaAPI : LocalAPI;

/* ========================= 状态 ========================= */

const state = {
    questions: [],
    filter: 'all',
    keyword: '',
    expanded: new Set(),      // 展开的问题 id
    drafts: new Map(),        // 未提交的回答草稿 questionId -> text
    answerImgs: new Map(),    // 未提交的回答配图 questionId -> [dataUrl]
    composerImages: [],       // 提问框里已选图片 [{id, dataUrl}]
    adminPass: sessionStorage.getItem('iron_qa_admin') || '',
    busy: false,
    lastPost: 0
};

let mainPicker = null;   // 提问框的图片选择器（init 里创建）

/* ========================= 渲染 ========================= */

function visibleQuestions() {
    let list = state.questions.slice();

    if (state.filter === 'unanswered') list = list.filter(q => !q.answers || q.answers.length === 0);
    if (state.filter === 'answered') list = list.filter(q => q.answers && q.answers.length > 0);

    const kw = state.keyword.trim().toLowerCase();
    if (kw) {
        list = list.filter(q => {
            if (String(q.content).toLowerCase().includes(kw)) return true;
            if (String(q.author).toLowerCase().includes(kw)) return true;
            return (q.answers || []).some(a => String(a.content).toLowerCase().includes(kw));
        });
    }
    return list;
}

function render() {
    const listBox = $('list');
    const emptyBox = $('empty');
    listBox.innerHTML = '';

    const items = visibleQuestions();

    if (!state.questions.length) {
        emptyBox.hidden = false;
        $('empty-title').textContent = '还没有人提问';
        $('empty-sub').textContent = '第一条问题就交给你了。';
        return;
    }

    if (!items.length) {
        emptyBox.hidden = false;
        if (state.keyword.trim()) {
            $('empty-title').textContent = '没有匹配的问题';
            $('empty-sub').textContent = '换个关键词试试，或者直接发一条新提问。';
        } else if (state.filter === 'unanswered') {
            $('empty-title').textContent = '所有问题都有人回答了 🎉';
            $('empty-sub').textContent = '切到"全部"看看已解答的内容。';
        } else {
            $('empty-title').textContent = '还没有已解答的问题';
            $('empty-sub').textContent = '去"待回答"里帮同学答一条？';
        }
        return;
    }

    emptyBox.hidden = true;
    items.forEach(q => listBox.appendChild(renderCard(q)));
}

function renderCard(q) {
    const card = el('article', 'q-card card');
    card.dataset.id = q.id;

    /* --- 头部 --- */
    const head = el('div', 'q-head');

    const av = el('div', 'avatar');
    const authorName = q.author || '匿名同学';
    av.textContent = authorName.trim().charAt(0).toUpperCase();
    av.style.background = avatarColor(authorName);

    const meta = el('div', 'q-meta');
    meta.appendChild(el('div', 'q-author', authorName));
    meta.appendChild(el('div', 'q-time', fmtTime(q.createdAt)));

    head.appendChild(av);
    head.appendChild(meta);
    card.appendChild(head);

    /* --- 正文 --- */
    card.appendChild(el('div', 'q-body', q.content));

    /* --- 配图 --- */
    if (Array.isArray(q.images) && q.images.length) {
        card.appendChild(buildImageGrid(q.images, 'q-imgs'));
    }

    /* --- 操作行 --- */
    const answers = Array.isArray(q.answers) ? q.answers : [];
    const isOpen = state.expanded.has(q.id);

    const actions = el('div', 'q-actions');
    const toggle = el('button', 'link-btn' + (answers.length ? ' answered' : ''),
        answers.length ? '💬 ' + answers.length + ' 条回答' : '💬 还没人回答，我来');
    toggle.addEventListener('click', () => {
        if (state.expanded.has(q.id)) state.expanded.delete(q.id);
        else state.expanded.add(q.id);
        render();
    });
    actions.appendChild(toggle);

    if (state.adminPass) {
        const del = el('button', 'del-btn', '删除');
        del.title = '站长删除这条提问';
        del.addEventListener('click', () => removeQuestion(q));
        actions.appendChild(del);
    }
    card.appendChild(actions);

    /* --- 回答区 --- */
    const box = el('div', 'answers' + (isOpen ? ' open' : ''));
    if (isOpen) {
        if (!answers.length) {
            box.appendChild(el('div', 'no-answer', '暂时还没有回答，欢迎你来写第一条。'));
        } else {
            answers.forEach(a => box.appendChild(renderAnswer(q, a)));
        }
        box.appendChild(renderAnswerComposer(q));
    }
    card.appendChild(box);

    return card;
}

function renderAnswer(q, a) {
    const item = el('div', 'a-item');

    const head = el('div', 'a-head');
    head.appendChild(el('span', 'a-author', a.author || '匿名同学'));
    head.appendChild(el('span', 'a-time', fmtTime(a.createdAt)));

    if (state.adminPass) {
        const del = el('button', 'a-del', '删除');
        del.title = '站长删除这条回答';
        del.addEventListener('click', () => removeAnswer(q, a));
        head.appendChild(del);
    }
    item.appendChild(head);
    item.appendChild(el('div', 'a-body', a.content));
    if (Array.isArray(a.images) && a.images.length) {
        item.appendChild(buildImageGrid(a.images, 'a-imgs'));
    }
    return item;
}

/** 非云端模式直接存 dataURL；云端模式先上传，换回公开 URL */
async function resolveImages(list) {
    const urls = (list || []).map(x => x.dataUrl).filter(Boolean);
    if (!urls.length) return [];
    if (useCloud) return await API.uploadImages(urls);
    return urls;
}

function renderAnswerComposer(q) {
    const box = el('div', 'a-composer');

    const ta = el('textarea', 'field');
    ta.placeholder = '写下你的回答，帮同学一把…（也可以只发图）';
    ta.maxLength = QA_CONFIG.maxLen;
    ta.value = state.drafts.get(q.id) || '';
    ta.addEventListener('input', () => {
        state.drafts.set(q.id, ta.value);
    });

    // 回答也支持配图（比如把解题过程拍下来）
    const getImgs = () => {
        if (!state.answerImgs.has(q.id)) state.answerImgs.set(q.id, []);
        return state.answerImgs.get(q.id);
    };
    const picker = createPicker({
        max: 2,
        compact: true,
        getList: getImgs,
        onChange: () => {}
    });

    const foot = el('div', 'a-foot');
    const nick = el('input', 'author-input');
    nick.placeholder = '昵称（选填）';
    nick.maxLength = 20;

    const btn = el('button', 'btn btn-primary', '提交回答');
    btn.addEventListener('click', async () => {
        const content = ta.value.trim();
        const imgs = getImgs();
        if (!content && !imgs.length) {
            toast('写点内容或加张图吧', true);
            ta.focus();
            return;
        }
        if (btn.disabled) return;

        btn.disabled = true;
        btn.textContent = '提交中…';
        try {
            const urls = await resolveImages(imgs);
            await API.addAnswer({
                questionId: q.id,
                content: content || '（见图）',
                author: cleanAuthor(nick.value),
                images: urls
            });
            state.drafts.delete(q.id);
            state.answerImgs.delete(q.id);
            await refresh();
            state.expanded.add(q.id);
            render();
            toast('回答已发布');
        } catch (e) {
            toast(e.message || '提交失败', true);
            btn.disabled = false;
            btn.textContent = '提交回答';
        }
    });

    foot.appendChild(nick);
    foot.appendChild(btn);
    box.appendChild(ta);
    box.appendChild(picker.el);
    box.appendChild(foot);
    return box;
}

/* ========================= 交互 ========================= */

async function refresh() {
    try {
        state.questions = await API.list();
        showError('');
    } catch (e) {
        showError('加载失败：' + (e.message || e) + '。请检查网络或后端配置。');
        state.questions = [];
    }
    // 清掉已经不存在的展开项
    const ids = new Set(state.questions.map(q => q.id));
    state.expanded.forEach(id => { if (!ids.has(id)) state.expanded.delete(id); });
}

async function removeQuestion(q) {
    if (!confirm('确定删除这条提问？该问题下的回答也会一并删除，且无法恢复。')) return;
    try {
        const ok = await API.deleteQuestion(q.id, state.adminPass);
        if (!ok) { toast('口令无效或已被拒绝', true); return; }
        await refresh();
        render();
        toast('已删除');
    } catch (e) {
        toast('删除失败：' + (e.message || e), true);
    }
}

async function removeAnswer(q, a) {
    if (!confirm('确定删除这条回答？')) return;
    try {
        const ok = await API.deleteAnswer(q.id, a.id, state.adminPass);
        if (!ok) { toast('口令无效或已被拒绝', true); return; }
        await refresh();
        state.expanded.add(q.id);
        render();
        toast('已删除');
    } catch (e) {
        toast('删除失败：' + (e.message || e), true);
    }
}

async function submitQuestion() {
    const input = $('q-input');
    const content = input.value.trim();
    const imgs = state.composerImages || [];

    if (!content && !imgs.length) {
        toast('先写点什么，或者传张题目照片吧', true);
        input.focus();
        return;
    }
    if (content.length > QA_CONFIG.maxLen) {
        toast('内容太长了，最多 ' + QA_CONFIG.maxLen + ' 字', true);
        return;
    }

    const now = Date.now();
    if (QA_CONFIG.rateLimitMs > 0 && now - state.lastPost < QA_CONFIG.rateLimitMs) {
        const wait = Math.ceil((QA_CONFIG.rateLimitMs - (now - state.lastPost)) / 1000);
        toast('慢一点，' + wait + ' 秒后可再发一条', true);
        return;
    }

    const btn = $('q-submit');
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = imgs.length ? '图片上传中…' : '发布中…';

    try {
        const urls = await resolveImages(imgs);

        btn.textContent = '发布中…';
        await API.addQuestion({
            content: content || '（图片提问）',
            author: cleanAuthor($('q-author').value),
            images: urls
        });

        state.lastPost = Date.now();
        input.value = '';
        state.composerImages = [];
        if (mainPicker) mainPicker.draw();
        updateCounter();
        state.filter = 'all';
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.filter === 'all'));

        await refresh();
        render();
        toast('提问已发布');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
        toast(e.message || '发布失败', true);
    } finally {
        btn.disabled = false;
        btn.textContent = '发布提问';
    }
}

function updateCounter() {
    const len = $('q-input').value.length;
    const c = $('q-count');
    c.textContent = len + ' / ' + QA_CONFIG.maxLen;
    c.classList.toggle('warn', len > QA_CONFIG.maxLen * 0.9);
}

/* ========================= 站长模式 ========================= */

function openMask() {
    $('mask').classList.add('show');
    $('pass-input').value = '';
    setTimeout(() => $('pass-input').focus(), 60);
}

function closeMask() {
    $('mask').classList.remove('show');
}

function setAdmin(pass) {
    state.adminPass = pass || '';
    if (pass) sessionStorage.setItem('iron_qa_admin', pass);
    else sessionStorage.removeItem('iron_qa_admin');
    $('admin-flag').classList.toggle('show', !!pass);
    render();
}

async function tryEnterAdmin() {
    const val = $('pass-input').value;
    if (!val) { toast('请输入口令', true); return; }

    const btn = $('pass-ok');
    btn.disabled = true;
    btn.textContent = '校验中…';

    try {
        const ok = await API.verifyPass(val);
        if (!ok) {
            toast('口令不对', true);
            return;
        }
        setAdmin(val);
        closeMask();
        toast('站长模式已开启');
    } catch (e) {
        // 后端不支持探测时，直接放行让删除动作本身去校验
        setAdmin(val);
        closeMask();
        toast('站长模式已开启');
    } finally {
        btn.disabled = false;
        btn.textContent = '进入';
    }
}

/* ========================= 初始化 ========================= */

function init() {
    // 模式提示
    if (!useCloud) {
        $('mode-bar').classList.add('show');
    }
    $('mode-close').addEventListener('click', () => $('mode-bar').classList.remove('show'));

    /* ---- 提问框的图片选择器 ---- */
    mainPicker = createPicker({
        max: QA_CONFIG.maxImages,
        getList: () => state.composerImages,
        onChange: () => {}
    });
    $('img-slot').appendChild(mainPicker.el);

    /* ---- Ctrl+V 粘贴截图 ---- */
    $('q-input').addEventListener('paste', (e) => {
        const items = (e.clipboardData && e.clipboardData.items) || [];
        const files = [];
        for (let i = 0; i < items.length; i++) {
            if (items[i].type && items[i].type.indexOf('image/') === 0) {
                const f = items[i].getAsFile();
                if (f) files.push(f);
            }
        }
        if (files.length) {
            e.preventDefault();
            mainPicker.addFiles(files);
        }
    });

    /* ---- 拖拽图片进来 ---- */
    const composer = $('composer');
    ['dragenter', 'dragover'].forEach(evt => {
        composer.addEventListener(evt, (e) => {
            if (!e.dataTransfer) return;
            e.preventDefault();
            composer.classList.add('drop-over');
        });
    });
    ['dragleave', 'drop'].forEach(evt => {
        composer.addEventListener(evt, (e) => {
            if (!e.dataTransfer) return;
            e.preventDefault();
            if (evt === 'dragleave' && composer.contains && composer.contains(e.relatedTarget)) return;
            composer.classList.remove('drop-over');
        });
    });
    composer.addEventListener('drop', (e) => {
        const files = (e.dataTransfer && e.dataTransfer.files) || [];
        if (files.length) mainPicker.addFiles(files);
    });

    /* ---- 大图查看 ---- */
    $('lb-close').addEventListener('click', closeLightbox);
    $('lightbox').addEventListener('click', (e) => {
        if (e.target === $('lightbox')) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
    });

    // 提问
    $('q-input').addEventListener('input', updateCounter);
    $('q-submit').addEventListener('click', submitQuestion);
    $('q-input').addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            submitQuestion();
        }
    });

    // 筛选
    $('tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('.tab');
        if (!btn) return;
        state.filter = btn.dataset.filter;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
        render();
    });

    // 搜索
    let searchTimer = null;
    $('search').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        const v = e.target.value;
        searchTimer = setTimeout(() => {
            state.keyword = v;
            render();
        }, 180);
    });

    // 站长入口
    $('admin-entry').addEventListener('click', () => {
        if (state.adminPass) { setAdmin(''); toast('已退出站长模式'); }
        else openMask();
    });
    $('admin-exit').addEventListener('click', () => { setAdmin(''); toast('已退出站长模式'); });
    $('pass-ok').addEventListener('click', tryEnterAdmin);
    $('pass-cancel').addEventListener('click', closeMask);
    $('pass-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') tryEnterAdmin();
        if (e.key === 'Escape') closeMask();
    });
    $('mask').addEventListener('click', (e) => {
        if (e.target === $('mask')) closeMask();
    });

    updateCounter();

    // 恢复已记住的站长身份
    if (state.adminPass) $('admin-flag').classList.add('show');

    // 首次加载
    const loading = $('loading');
    loading.hidden = false;
    refresh().then(() => {
        loading.hidden = true;
        render();
    });
}

document.addEventListener('DOMContentLoaded', init);
</script>
