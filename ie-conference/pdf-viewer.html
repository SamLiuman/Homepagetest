<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>PDF 阅读器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f2f5; color: #333;
    display: flex; flex-direction: column;
    -webkit-text-size-adjust: 100%;
  }

  .top-bar {
    background: linear-gradient(90deg, #6c5ce7, #a29bfe);
    color: #fff; padding: 12px 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    box-shadow: 0 2px 10px rgba(0,0,0,.12); z-index: 10;
  }
  .doc-name {
    flex: 1; min-width: 140px; font-size: 15px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn {
    color: #fff; text-decoration: none; font-size: 13px;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.55); background: transparent;
    font-family: inherit; line-height: 1.5;
  }
  .btn:hover { background: rgba(255,255,255,.18); }
  .btn:disabled { opacity: .45; cursor: not-allowed; background: transparent; }
  .btn.back { border-color: transparent; }

  .toolbar {
    background: #fff; padding: 8px 20px;
    display: flex; align-items: center; justify-content: center;
    gap: 8px; flex-wrap: wrap;
    border-bottom: 1px solid #e6e8eb; font-size: 14px;
  }
  .toolbar .btn { color: #555; border-color: #dcdfe6; }
  .toolbar .btn:hover { background: #f2f3f5; }
  .toolbar .btn:disabled { background: transparent; }
  .page-indicator { min-width: 92px; text-align: center; color: #555; }

  .stage {
    flex: 1; overflow: auto; padding: 20px;
    display: flex; justify-content: center; align-items: flex-start;
    background: #f0f2f5;
  }
  .canvas-wrap { background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.14); line-height: 0; }
  canvas { display: block; max-width: 100%; height: auto; }

  .msg {
    margin: auto; max-width: 520px; padding: 30px 26px; text-align: center;
    background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08);
    font-size: 15px; line-height: 1.8;
  }
  .msg h2 { font-size: 17px; margin-bottom: 10px; }
  .msg p { color: #666; font-size: 14px; }
  .msg .btn { color: #6c5ce7; border-color: #6c5ce7; display: inline-block; margin-top: 14px; }
  .msg .btn:hover { background: #f3f0ff; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 14px;
    border: 3px solid #e0e0e0; border-top-color: #6c5ce7;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 兜底：<iframe> 直接预览 */
  #fallbackFrame { width: 100%; height: 100%; border: 0; background: #fff; display: none; }

  @media (max-width: 600px) {
    .top-bar { padding: 10px 12px; gap: 8px; }
    .doc-name { font-size: 14px; }
    .toolbar { padding: 8px 12px; gap: 6px; font-size: 13px; }
    .stage { padding: 10px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <button class="btn back" onclick="history.length>1?history.back():location.href='./ie-conference.html'">← 返回</button>
  <div class="doc-name" id="docName">文档</div>
  <a class="btn" id="openBtn" target="_blank" rel="noopener">新窗口打开</a>
  <a class="btn" id="dlBtn" download>下载</a>
</div>

<div class="toolbar" id="toolbar" hidden>
  <button class="btn" id="firstBtn">« 首页</button>
  <button class="btn" id="prevBtn">‹ 上一页</button>
  <span class="page-indicator" id="pageInd">– / –</span>
  <button class="btn" id="nextBtn">下一页 ›</button>
  <button class="btn" id="lastBtn">末页 »</button>
  <button class="btn" id="outBtn">缩小 －</button>
  <button class="btn" id="resetBtn">缩放 <span id="zoomInd">100%</span></button>
  <button class="btn" id="inBtn">放大 ＋</button>
</div>

<div class="stage" id="stage">
  <div class="msg" id="msg">
    <div class="spinner"></div>
    正在加载 PDF…
  </div>
  <iframe id="fallbackFrame" title="PDF 预览"></iframe>
</div>

<script>
/* PDF.js（CDN 多源回退） */
var PDFJS_SOURCES = [
  ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
   'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
  ['https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js',
   'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js']
];

var $ = function (id) { return document.getElementById(id); };
var stage = $('stage'), msg = $('msg'), frame = $('fallbackFrame'), toolbar = $('toolbar');

/* 只允许打开站内文件 */
function resolveUrl(raw) {
  raw = String(raw || '').trim();
  if (!raw || /^javascript:/i.test(raw)) return '';
  try {
    var u = new URL(raw, location.href);
    if (u.protocol !== 'http:' && u.protocol !== 'https:' && u.protocol !== 'file:') return '';
    if (location.protocol.indexOf('http') === 0 && u.origin !== location.origin) return '';
    return u.href;
  } catch (e) { return ''; }
}

var params = new URLSearchParams(location.search);
var fileUrl = resolveUrl(params.get('file'));
var docTitle = params.get('name') || decodeURIComponent((fileUrl.split('/').pop() || '文档').split('?')[0]);

$('docName').textContent = docTitle;
$('docName').title = docTitle;
document.title = docTitle + ' - PDF 阅读器';
$('openBtn').href = fileUrl || '#';
$('dlBtn').href = fileUrl || '#';

function showMsg(html) {
  msg.innerHTML = html;
  msg.style.display = '';
  frame.style.display = 'none';
}

/* 兜底：用浏览器/系统的内置预览 */
function useFallback(reason) {
  toolbar.hidden = true;
  if (!fileUrl) {
    showMsg('<h2>缺少文件参数</h2><p>请通过列表页的链接进入本页。</p>');
    return;
  }
  frame.src = fileUrl;
  frame.style.display = 'block';
  msg.style.display = 'none';
  if (reason) console.warn('[pdf-viewer] 已降级为内置预览：' + reason);
}

function loadScript(src) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = function () { reject(new Error('load failed: ' + src)); };
    document.head.appendChild(s);
  });
}

function loadPdfjs(i) {
  i = i || 0;
  if (i >= PDFJS_SOURCES.length) return Promise.reject(new Error('all CDN failed'));
  var pair = PDFJS_SOURCES[i];
  return loadScript(pair[0]).then(function () {
    if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = pair[1];
    return window.pdfjsLib;
  }).catch(function () { return loadPdfjs(i + 1); });
}

/* ---------------- 渲染 ---------------- */

var pdf = null, pageNum = 1, scale = 1, rendering = false, pending = null;
var canvas = document.createElement('canvas');
var wrap = document.createElement('div');
wrap.className = 'canvas-wrap';
wrap.appendChild(canvas);

function setScale(v) {
  scale = Math.min(3, Math.max(0.5, Math.round(v * 100) / 100));
  $('zoomInd').textContent = Math.round(scale * 100) + '%';
  render(pageNum);
}

function fitScale(page) {
  // 首屏按容器宽度自适应，避免手机上过大或过小
  var v1 = page.getViewport({ scale: 1 });
  var w = stage.clientWidth - 44;
  if (w < 200) w = 320;
  var s = w / v1.width;
  return Math.min(2, Math.max(0.5, Math.round(s * 100) / 100));
}

function render(num) {
  if (!pdf) return;
  num = Math.min(pdf.numPages, Math.max(1, num));
  if (rendering) { pending = num; return; }
  rendering = true;

  pdf.getPage(num).then(function (page) {
    pageNum = num;
    var viewport = page.getViewport({ scale: scale });
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;

    canvas.width = Math.floor(viewport.width * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width = Math.floor(viewport.width) + 'px';
    canvas.style.height = 'auto';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    return page.render({ canvasContext: ctx, viewport: viewport, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise
      .then(function () { return page; });
  }).then(function (page) {
    // 封面按宽度自适应一次
    if (!render.__fitted) {
      render.__fitted = true;
      setScale(fitScale(page));
      return;
    }
    $('pageInd').textContent = pageNum + ' / ' + pdf.numPages;
    $('prevBtn').disabled = $('firstBtn').disabled = (pageNum <= 1);
    $('nextBtn').disabled = $('lastBtn').disabled = (pageNum >= pdf.numPages);
    rendering = false;
    if (pending != null) { var n = pending; pending = null; render(n); }
  }).catch(function (err) {
    rendering = false;
    useFallback(err && err.message);
  });
}

function boot() {
  if (!fileUrl) { useFallback('missing file'); return; }

  loadPdfjs().then(function (pdfjsLib) {
    if (!pdfjsLib) throw new Error('pdf.js 未加载');
    return pdfjsLib.getDocument({ url: fileUrl, cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/', cMapPacked: true }).promise;
  }).then(function (doc) {
    pdf = doc;
    msg.style.display = 'none';
    toolbar.hidden = false;
    stage.appendChild(wrap);
    scale = 1;
    render(1);
  }).catch(function (err) {
    useFallback(err && err.message);
  });
}

/* 事件 */
$('firstBtn').onclick = function () { render(1); };
$('prevBtn').onclick  = function () { render(pageNum - 1); };
$('nextBtn').onclick  = function () { render(pageNum + 1); };
$('lastBtn').onclick  = function () { render(pdf ? pdf.numPages : 1); };
$('inBtn').onclick    = function () { setScale(scale + 0.2); };
$('outBtn').onclick   = function () { setScale(scale - 0.2); };
$('resetBtn').onclick = function () { setScale(1); };

document.addEventListener('keydown', function (e) {
  if (!pdf) return;
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') render(pageNum - 1);
  if (e.key === 'ArrowRight' || e.key === 'PageDown') render(pageNum + 1);
});

var lastW = stage.clientWidth, rt;
window.addEventListener('resize', function () {
  clearTimeout(rt);
  rt = setTimeout(function () {
    if (!pdf || Math.abs(stage.clientWidth - lastW) < 60) return;
    lastW = stage.clientWidth;
    render.__fitted = false;
    render(pageNum);
  }, 250);
});

boot();
</script>
</body>
</html>
