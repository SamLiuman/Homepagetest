<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>PDF 阅读器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f2f5; color: #333;
    display: flex; flex-direction: column;
    -webkit-text-size-adjust: 100%;
  }

  .top-bar {
    background: linear-gradient(90deg, #6c5ce7, #a29bfe);
    color: #fff; padding: 12px 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    box-shadow: 0 2px 10px rgba(0,0,0,.12); z-index: 10;
  }
  .doc-name {
    flex: 1; min-width: 140px; font-size: 15px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn {
    color: #fff; text-decoration: none; font-size: 13px;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.55); background: transparent;
    font-family: inherit; line-height: 1.5; white-space: nowrap;
  }
  .btn:hover { background: rgba(255,255,255,.18); }
  .btn:disabled { opacity: .45; cursor: not-allowed; background: transparent; }
  .btn.back { border-color: transparent; }

  .toolbar {
    background: #fff; padding: 8px 20px;
    display: flex; align-items: center; justify-content: center;
    gap: 8px; flex-wrap: wrap;
    border-bottom: 1px solid #e6e8eb; font-size: 14px;
  }
  .toolbar .btn { color: #555; border-color: #dcdfe6; }
  .toolbar .btn:hover { background: #f2f3f5; }
  .toolbar .btn:disabled { background: transparent; }
  .toolbar .btn.on { color: #6c5ce7; border-color: #6c5ce7; background: #f3f0ff; }
  .page-indicator { min-width: 92px; text-align: center; color: #555; }

  /* 用 text-align 居中，而不是 flex。
     flex + justify-content:center 在内容溢出时会把左侧裁掉且滚不到；
     inline-block 溢出只往右延伸，可以完整滚动。 */
  .stage {
    flex: 1; overflow: auto; padding: 20px;
    text-align: center;
  }
  .stage.is-raw { padding: 0; }
  .canvas-wrap {
    display: inline-block; text-align: left;
    background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.14); line-height: 0;
  }
  /* 不要给 canvas 加 max-width / height:auto —— 会抵消 JS 设置的缩放尺寸。
     宽高完全由 JS 按 viewport 精确计算。 */
  canvas { display: block; }

  .msg {
    margin: auto; max-width: 520px; padding: 30px 26px; text-align: center;
    background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08);
    font-size: 15px; line-height: 1.8;
  }
  .msg h2 { font-size: 17px; margin-bottom: 10px; }
  .msg p { color: #666; font-size: 14px; }
  .msg .btn { color: #6c5ce7; border-color: #6c5ce7; display: inline-block; margin-top: 14px; }
  .msg .btn:hover { background: #f3f0ff; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 14px;
    border: 3px solid #e0e0e0; border-top-color: #6c5ce7;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .raw-tip {
    display: none; padding: 8px 20px; font-size: 13px; color: #854F0B;
    background: #FAEEDA; border-bottom: 1px solid #FAC775; text-align: center;
  }
  #fallbackFrame { width: 100%; height: 100%; border: 0; background: #fff; display: none; }

  @media (max-width: 600px) {
    .top-bar { padding: 10px 12px; gap: 8px; }
    .doc-name { font-size: 14px; }
    .toolbar { padding: 8px 12px; gap: 6px; font-size: 13px; }
    .stage { padding: 10px; }
    .page-indicator { min-width: 74px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <button class="btn back" onclick="history.length>1?history.back():location.href='./ie-conference.html'">← 返回</button>
  <div class="doc-name" id="docName">文档</div>
  <a class="btn" id="openBtn" target="_blank" rel="noopener">新窗口打开</a>
  <a class="btn" id="dlBtn" download>下载</a>
</div>

<div class="raw-tip" id="rawTip">
  已切换为浏览器内置预览。若下方空白（部分手机浏览器不支持），请点右上角「新窗口打开」或「下载」。
</div>

<div class="toolbar" id="toolbar" hidden>
  <button class="btn" id="firstBtn">« 首页</button>
  <button class="btn" id="prevBtn">‹ 上一页</button>
  <span class="page-indicator" id="pageInd">– / –</span>
  <button class="btn" id="nextBtn">下一页 ›</button>
  <button class="btn" id="lastBtn">末页 »</button>
  <button class="btn" id="outBtn">缩小 －</button>
  <button class="btn" id="zoomInd" title="点击恢复适应页面">–</button>
  <button class="btn" id="inBtn">放大 ＋</button>
  <button class="btn on" id="fitBtn">适应页面</button>
</div>

<div class="stage" id="stage">
  <div class="msg" id="msg">
    <div class="spinner"></div>
    正在加载 PDF…
  </div>
  <iframe id="fallbackFrame" title="PDF 预览"></iframe>
</div>

<script>
var PDFJS_VERSION = '3.11.174';
var PDFJS_SOURCES = [
  { js:     'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VERSION + '/build/pdf.min.js',
    worker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VERSION + '/build/pdf.worker.min.js',
    cmaps:  'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VERSION + '/cmaps/',
    fonts:  'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VERSION + '/standard_fonts/' },
  { js:     'https://unpkg.com/pdfjs-dist@' + PDFJS_VERSION + '/build/pdf.min.js',
    worker: 'https://unpkg.com/pdfjs-dist@' + PDFJS_VERSION + '/build/pdf.worker.min.js',
    cmaps:  'https://unpkg.com/pdfjs-dist@' + PDFJS_VERSION + '/cmaps/',
    fonts:  'https://unpkg.com/pdfjs-dist@' + PDFJS_VERSION + '/standard_fonts/' }
];

var $ = function (id) { return document.getElementById(id); };
var stage = $('stage'), msg = $('msg'), frame = $('fallbackFrame'), toolbar = $('toolbar');

/* 只允许打开站内文件 */
function resolveUrl(raw) {
  raw = String(raw || '').trim();
  if (!raw || /^javascript:/i.test(raw)) return '';
  try {
    var u = new URL(raw, location.href);
    if (u.protocol !== 'http:' && u.protocol !== 'https:' && u.protocol !== 'file:') return '';
    if (location.protocol.indexOf('http') === 0 && u.origin !== location.origin) return '';
    return u.href;
  } catch (e) { return ''; }
}

var params = new URLSearchParams(location.search);
var fileUrl = resolveUrl(params.get('file'));
var docTitle = params.get('name') || decodeURIComponent((fileUrl.split('/').pop() || '文档').split('?')[0]);

$('docName').textContent = docTitle;
$('docName').title = docTitle;
document.title = docTitle + ' - PDF 阅读器';
$('openBtn').href = fileUrl || '#';
$('dlBtn').href = fileUrl || '#';

function showMsg(html) {
  msg.innerHTML = html;
  msg.style.display = '';
  frame.style.display = 'none';
  stage.classList.remove('is-raw');
}

/* 兜底：用浏览器/系统的内置预览 */
function useFallback(reason) {
  toolbar.hidden = true;
  if (!fileUrl) {
    showMsg('<h2>缺少文件参数</h2><p>请通过列表页的链接进入本页。</p>');
    return;
  }
  frame.src = fileUrl;
  frame.style.display = 'block';
  msg.style.display = 'none';
  stage.classList.add('is-raw');
  $('rawTip').style.display = 'block';
  if (reason) console.warn('[pdf-viewer] 已降级为内置预览：' + reason);
}

function loadScript(src) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = function () { reject(new Error('load failed: ' + src)); };
    document.head.appendChild(s);
  });
}

function loadPdfjs(i) {
  i = i || 0;
  if (i >= PDFJS_SOURCES.length) return Promise.reject(new Error('all CDN failed'));
  var src = PDFJS_SOURCES[i];
  return loadScript(src.js).then(function () {
    if (!window.pdfjsLib) throw new Error('pdf.js 未挂载');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = src.worker;
    return { lib: window.pdfjsLib, src: src };
  }).catch(function (e) {
    if (i + 1 >= PDFJS_SOURCES.length) throw e;
    return loadPdfjs(i + 1);
  });
}

/* ---------------- 渲染 ----------------
   状态设计要点（上一版的 bug 就出在这里）：
   - 用 renderTask + seq 令牌控制并发，不再用布尔锁。
     上一版首屏自适应分支里 return 时忘了复位 rendering，
     导致锁永远不解开，翻页/缩放全部失效。
   - 每次渲染前 cancel 上一个 renderTask，快速连点不会错乱。
   ------------------------------------------------------------------ */

var pdf = null, pageCount = 0, pageNum = 1;
var scale = 1;          // 当前实际缩放（fit 模式下由计算得出）
var fitMode = true;     // true = 按可视区自动适配；false = 用户手动缩放
var renderTask = null;  // 正在渲染的任务，用于取消
var renderSeq = 0;      // 令牌：只有最新一次请求才允许更新 UI

var canvas = document.createElement('canvas');
var wrap = document.createElement('div');
wrap.className = 'canvas-wrap';
wrap.appendChild(canvas);

function clampScale(s) {
  if (!isFinite(s) || s <= 0) return 1;
  return Math.min(5, Math.max(0.25, Math.round(s * 100) / 100));
}

function stageBox() {
  var cs = window.getComputedStyle(stage);
  var px = function (v) { return parseFloat(v) || 0; };
  return {
    w: stage.clientWidth  - px(cs.paddingLeft) - px(cs.paddingRight)  - 4,
    h: stage.clientHeight - px(cs.paddingTop)  - px(cs.paddingBottom) - 4
  };
}

/* 适应页面：宽高双向约束，保证整页可见 */
function fitScaleFor(page) {
  var v1 = page.getViewport({ scale: 1 });
  var box = stageBox();
  var s = v1.width > 0 ? box.w / v1.width : 1;
  // 仅当页面明显高于可视区时才追加高度约束，避免矮页面被压得过小
  if (box.h > 220 && v1.height > 0 && v1.height * s > box.h) {
    s = box.h / v1.height;
  }
  return clampScale(s);
}

function updateUI() {
  $('pageInd').textContent = pageNum + ' / ' + (pageCount || '-');
  $('zoomInd').textContent = Math.round(scale * 100) + '%';
  var single = pageCount <= 1;
  $('firstBtn').disabled = $('prevBtn').disabled = (pageNum <= 1);
  $('nextBtn').disabled  = $('lastBtn').disabled = (pageNum >= pageCount) || single;
  $('fitBtn').classList.toggle('on', fitMode);
}

function renderPage(num) {
  if (!pdf) return;
  num = Math.min(pageCount, Math.max(1, num | 0));

  // 取消进行中的渲染；它的 promise 会 reject，下面会按名字忽略
  if (renderTask) {
    try { renderTask.cancel(); } catch (e) {}
    renderTask = null;
  }

  var seq = ++renderSeq;
  pageNum = num;

  pdf.getPage(num).then(function (page) {
    if (seq !== renderSeq) return null;          // 已有更新的请求
    if (!page) throw new Error('取不到第 ' + num + ' 页');

    var s = fitMode ? fitScaleFor(page) : scale;
    scale = s;
    var viewport = page.getViewport({ scale: s });

    // dpr 只应用一次：canvas 位图放大 + render 的 transform 二选一。
    // 上一版 setTransform(dpr,...) 和 transform:[dpr,...] 同时用，
    // 在 dpr=2 的屏上等于放大 4 倍，页面只显示左上角一小块。
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width  = Math.max(1, Math.floor(viewport.width  * dpr));
    canvas.height = Math.max(1, Math.floor(viewport.height * dpr));
    canvas.style.width  = Math.max(1, Math.floor(viewport.width))  + 'px';
    canvas.style.height = Math.max(1, Math.floor(viewport.height)) + 'px';

    var ctx = canvas.getContext('2d');
    var task = page.render({
      canvasContext: ctx,
      viewport: viewport,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
    });
    renderTask = task;
    return task.promise.then(function () {
      if (renderTask === task) renderTask = null;
    });
  }).then(function () {
    if (seq !== renderSeq) return;
    updateUI();
  }).catch(function (err) {
    if (err && err.name === 'RenderingCancelledException') return;  // 主动取消，忽略
    if (seq !== renderSeq) return;
    renderTask = null;
    console.error('[pdf-viewer] 渲染失败', err);
    useFallback(err && err.message);
  });
}

function zoomTo(s) {
  fitMode = false;
  scale = clampScale(s);
  $('zoomInd').textContent = Math.round(scale * 100) + '%';
  $('fitBtn').classList.remove('on');
  renderPage(pageNum);
}

function boot() {
  if (!fileUrl) { useFallback('missing file'); return; }

  loadPdfjs().then(function (bundle) {
    return bundle.lib.getDocument({
      url: fileUrl,
      cMapUrl: bundle.src.cmaps,
      cMapPacked: true,
      standardFontDataUrl: bundle.src.fonts
    }).promise;
  }).then(function (doc) {
    pdf = doc;
    pageCount = doc.numPages;
    msg.style.display = 'none';
    toolbar.hidden = false;
    stage.appendChild(wrap);
    fitMode = true;
    renderPage(1);
  }).catch(function (err) {
    console.error('[pdf-viewer] 加载失败', err);
    useFallback(err && err.message);
  });
}

/* 事件 */
$('firstBtn').onclick = function () { renderPage(1); };
$('prevBtn').onclick  = function () { renderPage(pageNum - 1); };
$('nextBtn').onclick  = function () { renderPage(pageNum + 1); };
$('lastBtn').onclick  = function () { renderPage(pageCount); };
$('inBtn').onclick    = function () { zoomTo(scale + 0.2); };
$('outBtn').onclick   = function () { zoomTo(scale - 0.2); };
$('zoomInd').onclick  = function () { $('fitBtn').onclick(); };
$('fitBtn').onclick   = function () {
  fitMode = true;
  $('fitBtn').classList.add('on');
  renderPage(pageNum);
};

document.addEventListener('keydown', function (e) {
  if (!pdf) return;
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   { renderPage(pageNum - 1); e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { renderPage(pageNum + 1); e.preventDefault(); }
  if (e.key === 'Home') { renderPage(1); e.preventDefault(); }
  if (e.key === 'End')  { renderPage(pageCount); e.preventDefault(); }
  if (e.key === '+' || e.key === '=') { zoomTo(scale + 0.2); }
  if (e.key === '-' || e.key === '_') { zoomTo(scale - 0.2); }
});

/* 窗口尺寸变化：fit 模式下重新适配；手动缩放则保持原比例不动 */
var rt;
window.addEventListener('resize', function () {
  clearTimeout(rt);
  rt = setTimeout(function () { if (pdf && fitMode) renderPage(pageNum); }, 200);
});

boot();
</script>
</body>
</html>
