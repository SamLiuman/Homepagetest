<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于感谢第十届北京理工大学权益提案大赛IE团队及相关人员的通告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
            line-height: 1.85;
            color: #333;
            background-color: #f7f8fa;
            padding: 40px 20px;
        }
        .document-container {
            max-width: 920px;
            margin: 0 auto;
            background: #ffffff;
            padding: 60px 70px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
            border-radius: 6px;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            line-height: 1.7;
            margin-bottom: 45px;
            color: #1a1a1a;
            font-weight: 600;
        }
	.recipient {
            font-size: 16px;
            margin-bottom: 14px;
            text-indent: 0;
        }
        h2 {
            font-size: 20px;
            margin: 32px 0 16px;
            color: #1a1a1a;
            border-left: 4px solid #165DFF;
            padding-left: 12px;
            font-weight: 600;
        }
        h3 {
            font-size: 18px;
            margin: 22px 0 12px;
            color: #222;
            font-weight: 600;
        }
        p {
            margin-bottom: 10px;
            text-indent: 2em;
            font-size: 16px;
        }
        .no-indent {
            text-indent: 0;
        }
        ol {
            margin-left: 2.2em;
            margin-bottom: 15px;
        }
        ol li {
            margin-bottom: 9px;
            font-size: 16px;
        }
        /* 公式样式 */
        .formula-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 24px 0;
            font-size: 16px;
        }
        .fraction {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .fraction-top, .fraction-bottom {
            padding: 5px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fraction-top {
            border-bottom: 1px solid #333;
        }
        .sigma {
            font-size: 30px;
            line-height: 1;
        }
        .sigma-limits {
            display: flex;
            flex-direction: column;
            font-size: 12px;
            line-height: 1.1;
            text-align: center;
        }
        sub {
            font-size: 0.85em;
        }
        .formula-desc {
            margin-top: 8px;
        }
        /* 页脚落款 */
        .footer-sign {
            margin-top: 60px;
            text-align: right;
        }
        .footer-sign p {
            text-indent: 0;
            margin-bottom: 6px;
            font-size: 16px;
        }
        a {
            color: #165DFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .document-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 20px;
            }
            h2 {
                font-size: 18px;
            }
        }
	/* 红头公文格式 */
        .doc-header {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #c01515;
            line-height: 1.6;
        }
        .doc-rule {
            height: 2px;
            background-color: #c01515;
            margin: 14px auto 10px;
            width: 100%;
        }
        .doc-serial {
            text-align: center;
            font-size: 15px;
            color: #555;
            margin-bottom: 38px;
        }
    </style>
</head>
<body>
    <div class="document-container">
        <div class="doc-header">IE教学科研竞赛委员会文件</div>
        <div class="doc-rule"></div>
        <div class="doc-serial">IE教科竞〔2026〕3 号</div>

        <h1>关于感谢第十届北京理工大学权益提案大赛<br>IE 团队及相关人员的通告</h1>

        <p class="recipient">团队全体参赛成员：</p>
        <p>在团队全体人员刘铁彦、谭凯阳、肖凯天、姚烨共同努力下，我团队参与第十届北京理工大学权益提案大赛的参赛项目，历经层层评审与现场答辩，最终斩获赛事二等奖，圆满完成本次参赛任务。在此，我作为组长向全体组员，致以最诚挚的谢意！</p>
        <p>此次获奖是全体成员通力协作的成果。希望大家以此为新起点，不忘初心、总结经验，在后续学习与科创实践中再创新的成绩。</p>
        <p>特此通告。</p>

        <div class="footer-sign">
            <p>教学科研竞赛委员会 本项目组组长</p>
            <p>IE</p>
            <p>2026 年 5 月 27 日</p>
        </div>
    </div>
</body>
</html>
