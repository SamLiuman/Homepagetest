<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>综合成绩查询与估算系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f0f2f5;min-height:100vh;color:#333}
.top-bar{background:linear-gradient(90deg,#0f4c81,#1a73e8);color:#fff;padding:18px 40px;display:flex;justify-content:space-between;align-items:center}
.top-bar h1{font-size:20px;font-weight:600}
.back-btn{color:#fff;text-decoration:none;padding:7px 16px;border:1px solid rgba(255,255,255,.5);border-radius:6px;font-size:14px}
.back-btn:hover{background:rgba(255,255,255,.15)}
.login-wrapper{display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 70px);padding:20px}
.login-box{background:#fff;padding:50px 40px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,.08);width:100%;max-width:420px;text-align:center}
.login-box h2{margin-bottom:30px;color:#333;font-size:22px}
.login-box input{width:100%;padding:14px 16px;border:1px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:20px;outline:none;transition:border-color .3s}
.login-box input:focus{border-color:#1a73e8}
.login-box button{width:100%;padding:14px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;transition:background .3s}
.login-box button:hover{background:#0f4c81}
.error-msg{color:#e74c3c;margin-top:10px;font-size:14px;display:none}
.main-container{max-width:1280px;margin:24px auto;padding:0 20px;display:none}
.major-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab-btn{padding:9px 18px;background:#fff;border:1px solid #ddd;border-radius:8px;cursor:pointer;font-size:14px;transition:all .3s}
.tab-btn.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.tab-btn:hover:not(.active){border-color:#1a73e8;color:#1a73e8}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.toolbar input[type=text]{padding:9px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;flex:1;min-width:200px;outline:none}
.toolbar input[type=text]:focus{border-color:#1a73e8}
.toolbar .stat{font-size:13px;color:#666;background:#fff;padding:7px 12px;border-radius:6px;border:1px solid #eee}
.toolbar .stat b{color:#0f4c81}
.view-tabs{display:flex;gap:6px;margin-bottom:14px}
.view-tab{padding:7px 16px;background:#fff;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:13px}
.view-tab.active{background:#0f4c81;color:#fff;border-color:#0f4c81}
.grade-panel{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:none}
.grade-panel.active{display:block}
.panel-title{font-size:18px;font-weight:600;margin-bottom:16px;color:#0f4c81;padding-bottom:10px;border-bottom:2px solid #e8f0fe;display:flex;justify-content:space-between;align-items:center}
.table-wrap{overflow-x:auto;border:1px solid #eee;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
thead th{background:#f5f8fc;color:#0f4c81;padding:10px 8px;text-align:left;position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:2px solid #d6e4f5}
thead th:hover{background:#e8f0fe}
thead th .arrow{font-size:10px;margin-left:4px;opacity:.5}
thead th.sort-asc .arrow,thead th.sort-desc .arrow{opacity:1;color:#1a73e8}
tbody tr{border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s}
tbody tr:hover{background:#f5f9ff}
tbody tr.expanded{background:#eef5ff}
tbody td{padding:9px 8px;white-space:nowrap}
.rank-badge{display:inline-block;min-width:28px;text-align:center;padding:2px 8px;border-radius:10px;font-weight:600;font-size:12px}
.rank-1{background:#ffd700;color:#7a5c00}
.rank-2{background:#c0c0c0;color:#444}
.rank-3{background:#cd7f32;color:#fff}
.rank-other{background:#e8f0fe;color:#0f4c81}
.fail-tag{color:#e74c3c;font-weight:600}
.pass-tag{color:#27ae60}
.detail-row{background:#fafbfc !important;cursor:default !important}
.detail-row td{padding:16px 20px;white-space:normal}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 24px;font-size:13px}
.detail-grid .item{display:flex;justify-content:space-between;border-bottom:1px dashed #eee;padding:4px 0}
.detail-grid .item span:first-child{color:#888}
.detail-grid .item span:last-child{color:#333;font-weight:500}
.semester-bar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.semester-bar .sem{background:#e8f0fe;padding:4px 10px;border-radius:4px;font-size:12px;color:#0f4c81}
.empty{text-align:center;padding:40px;color:#999}
/* GPA计算器 */
.calc-section{margin-top:24px;padding-top:20px;border-top:2px dashed #e0e0e0}
.calc-section h3{color:#0f4c81;margin-bottom:14px;font-size:16px}
.calc-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.form-item label{display:block;margin-bottom:5px;font-size:13px;color:#666}
.form-item input{width:100%;padding:9px 11px;border:1px solid #ddd;border-radius:6px;font-size:14px}
.calc-btn{padding:10px 24px;background:#27ae60;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;margin-bottom:14px}
.calc-btn:hover{background:#219150}
.result-box{background:#f8f9fa;padding:16px;border-radius:8px;border-left:4px solid #27ae60}
.result-box h4{margin-bottom:8px;color:#333;font-size:14px}
.result-value{font-size:26px;font-weight:600;color:#27ae60}
.rule-note{margin-top:14px;padding:12px 14px;background:#fff8e1;border-radius:6px;font-size:12px;color:#8d6e63;line-height:1.7}
@media(max-width:600px){.top-bar{padding:15px 20px}.grade-panel{padding:16px}}
</style>
</head>
<body>
<div class="top-bar">
<h1>综合成绩查询与估算系统</h1>
<a href="../index.html" class="back-btn">← 返回主页</a>
</div>

<div class="login-wrapper" id="loginSection">
<div class="login-box">
<h2>🔐 请输入访问密钥</h2>
<input type="password" id="keyInput" placeholder="请输入密钥">
<button onclick="verifyKey()">进入系统</button>
<div class="error-msg" id="errorMsg">密钥错误，请重试</div>
</div>
</div>

<div class="main-container" id="mainSection">
<div class="major-tabs" id="majorTabs"></div>
<div class="toolbar">
<input type="text" id="searchInput" placeholder="🔍 搜索姓名 / 学号 / 班级..." oninput="renderTable()">
<span class="stat">共 <b id="totalCount">0</b> 人，显示 <b id="shownCount">0</b> 人</span>
</div>
<div class="view-tabs">
<div class="view-tab active" onclick="switchView('list',this)">📋 成绩单</div>
<div class="view-tab" onclick="switchView('calc',this)">🧮 平均学分绩估算</div>
</div>

<div class="grade-panel active" id="listPanel">
<div class="panel-title">
<span id="panelTitle">成绩单</span>
<span style="font-size:13px;color:#888;font-weight:normal">点击表头排序 · 点击行查看详情</span>
</div>
<div class="table-wrap">
<table id="gradeTable">
<thead><tr id="tableHead"></tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>

<div class="grade-panel" id="calcPanel">
<div class="panel-title"><span>平均学分绩计算器</span></div>
<div class="calc-form">
<div class="form-item"><label>学期1 学分×成绩</label><input type="text" placeholder="例如 4×90" class="course-input"></div>
<div class="form-item"><label>学期2 学分×成绩</label><input type="text" placeholder="例如 3×85" class="course-input"></div>
<div class="form-item"><label>学期3 学分×成绩</label><input type="text" placeholder="" class="course-input"></div>
<div class="form-item"><label>学期4 学分×成绩</label><input type="text" placeholder="" class="course-input"></div>
<div class="form-item"><label>学期5 学分×成绩</label><input type="text" placeholder="" class="course-input"></div>
<div class="form-item"><label>学期6 学分×成绩</label><input type="text" placeholder="" class="course-input"></div>
</div>
<button class="calc-btn" onclick="calculateGPA()">计算平均学分绩</button>
<div class="result-box"><h4>计算结果</h4><div class="result-value" id="gpaResult">--</div></div>
<div class="rule-note">
<strong>计算规则：</strong>课程平均学分绩 = Σ(学分×成绩) / Σ学分<br>
取前6个学期全部课程，不及格按0分计算，校公选课不及格不参与计算。输入格式：学分×成绩（用乘号×或字母x分隔均可）。
</div>
</div>
</div>

const MAJORS = Object.keys(GRADE_DATA);
let currentMajor = MAJORS[0];
let sortKey = '综合排名名次';
let sortAsc = true;
let expandedRow = null;

/* 列定义：key, 表头, 是否数值 */
const COLUMNS = [
  {key:'综合排名名次',label:'综合排名',num:true,width:70},
  {key:'学号',label:'学号',num:false},
  {key:'姓名',label:'姓名',num:false},
  {key:'班级',label:'班级',num:false},
  {key:'课程成绩本专业名次',label:'课程成绩排名',num:true},
  {key:'课程成绩计算结果',label:'课程成绩(均分)',num:true},
  {key:'其他表现成绩',label:'其他表现',num:true},
  {key:'综合成绩',label:'综合成绩',num:true},
  {key:'是否通过全国大学英语四级',label:'英语四级',num:false},
  {key:'不及格课程门数',label:'不及格',num:true},
  {key:'纳入计算课程获得总学分',label:'总学分',num:true},
];

function verifyKey(){
  const input=document.getElementById('keyInput').value;
  if(input==="2026bit"){
    document.getElementById('loginSection').style.display='none';
    document.getElementById('mainSection').style.display='block';
    initApp();
  }else{
    document.getElementById('errorMsg').style.display='block';
  }
}
document.getElementById('keyInput').addEventListener('keypress',e=>{if(e.key==='Enter')verifyKey()});

function initApp(){
  // 生成专业tab
  const tabs=document.getElementById('majorTabs');
  tabs.innerHTML='';
  MAJORS.forEach((m,i)=>{
    const btn=document.createElement('button');
    btn.className='tab-btn'+(i===0?' active':'');
    btn.textContent=m+' ('+GRADE_DATA[m].length+')';
    btn.onclick=()=>switchMajor(i);
    tabs.appendChild(btn);
  });
  // 表头
  const head=document.getElementById('tableHead');
  head.innerHTML='';
  COLUMNS.forEach(c=>{
    const th=document.createElement('th');
    th.textContent=c.label;
    th.dataset.key=c.key;
    th.innerHTML=c.label+'<span class="arrow">↕</span>';
    th.onclick=()=>sortBy(c.key);
    head.appendChild(th);
  });
  renderTable();
}

function switchMajor(i){
  currentMajor=MAJORS[i];
  document.querySelectorAll('.tab-btn').forEach((b,idx)=>b.classList.toggle('active',idx===i));
  expandedRow=null;
  renderTable();
}

function switchView(v,el){
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('listPanel').classList.toggle('active',v==='list');
  document.getElementById('calcPanel').classList.toggle('active',v==='calc');
}

function sortBy(key){
  if(sortKey===key){sortAsc=!sortAsc}else{sortKey=key;sortAsc=true}
  renderTable();
}

function fmt(v){
  if(v===null||v===undefined||v==='')return '-';
  if(typeof v==='number')return Number.isInteger(v)?v:v.toFixed(2);
  return v;
}

function renderTable(){
  const rows=GRADE_DATA[currentMajor]||[];
  const kw=document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered=rows.filter(r=>{
    if(!kw)return true;
    return (String(r['姓名']||'').toLowerCase().includes(kw)
      || String(r['学号']||'').includes(kw)
      || String(r['班级']||'').toLowerCase().includes(kw));
  });
  // 排序
  const col=COLUMNS.find(c=>c.key===sortKey);
  filtered.sort((a,b)=>{
    let va=a[sortKey],vb=b[sortKey];
    if(col&&col.num){va=Number(va)||0;vb=Number(vb)||0}
    else{va=String(va||'');vb=String(vb||'')}
    if(va<vb)return sortAsc?-1:1;
    if(va>vb)return sortAsc?1:-1;
    return 0;
  });
  // 表头排序指示
  document.querySelectorAll('#tableHead th').forEach(th=>{
    th.classList.remove('sort-asc','sort-desc');
    const arrow=th.querySelector('.arrow');
    if(arrow)arrow.textContent='↕';
    if(th.dataset.key===sortKey){
      th.classList.add(sortAsc?'sort-asc':'sort-desc');
      if(arrow)arrow.textContent=sortAsc?'↑':'↓';
    }
  });
  // 标题
  document.getElementById('panelTitle').textContent=currentMajor+' · 成绩单（共'+rows.length+'人）';
  document.getElementById('totalCount').textContent=rows.length;
  document.getElementById('shownCount').textContent=filtered.length;
  // 表体
  const body=document.getElementById('tableBody');
  body.innerHTML='';
  if(filtered.length===0){
    body.innerHTML='<tr><td colspan="'+COLUMNS.length+'" class="empty">未找到匹配记录</td></tr>';
    return;
  }
  filtered.forEach((r,idx)=>{
    const tr=document.createElement('tr');
    const rank=r['综合排名名次'];
    let rankCls='rank-other';
    if(rank===1)rankCls='rank-1';
    else if(rank===2)rankCls='rank-2';
    else if(rank===3)rankCls='rank-3';
    tr.innerHTML=COLUMNS.map(c=>{
      let v=r[c.key];
      let display=fmt(v);
      if(c.key==='综合排名名次')display='<span class="rank-badge '+rankCls+'">'+fmt(v)+'</span>';
      if(c.key==='是否通过全国大学英语四级')display=v==='是'?'<span class="pass-tag">是</span>':'<span class="fail-tag">否</span>';
      if(c.key==='不及格课程门数'&&Number(v)>0)display='<span class="fail-tag">'+fmt(v)+'</span>';
      return '<td>'+display+'</td>';
    }).join('');
    tr.onclick=()=>toggleDetail(tr,r);
    body.appendChild(tr);
  });
}

function toggleDetail(tr,r){
  // 关闭已展开
  if(expandedRow&&expandedRow!==tr){
    expandedRow.classList.remove('expanded');
    if(expandedRow.nextSibling&&expandedRow.nextSibling.classList&&expandedRow.nextSibling.classList.contains('detail-row')){
      expandedRow.nextSibling.remove();
    }
  }
  if(expandedRow===tr){
    tr.classList.remove('expanded');
    if(tr.nextSibling)tr.nextSibling.remove();
    expandedRow=null;
    return;
  }
  tr.classList.add('expanded');
  expandedRow=tr;
  const dtr=document.createElement('tr');
  dtr.className='detail-row';
  const semHtml=['第1学期其他表现','第2学期其他表现','第3学期其他表现','第4学期其他表现','第5学期其他表现','第6学期其他表现']
    .map(k=>'<div class="sem">'+k.replace('其他表现','')+': '+(fmt(r[k]))+'</div>').join('');
  dtr.innerHTML='<td colspan="'+COLUMNS.length+'">'
    +'<div class="detail-grid">'
    +'<div class="item"><span>序号</span><span>'+fmt(r['序号'])+'</span></div>'
    +'<div class="item"><span>学号</span><span>'+fmt(r['学号'])+'</span></div>'

function calculateGPA(){
  const inputs=document.querySelectorAll('.course-input');
  let totalScore=0,totalCredit=0;
  inputs.forEach(input=>{
    const val=input.value.trim();
    if(!val)return;
    const parts=val.split(/[×xX*]/).map(s=>s.trim()).filter(Boolean);
    if(parts.length>=2){
      const credit=Number(parts[0]),score=Number(parts[1]);
      if(!isNaN(credit)&&!isNaN(score)){
        totalScore+=credit*score;
        totalCredit+=credit;
      }
    }
  });
  const el=document.getElementById('gpaResult');
  if(totalCredit>0)el.textContent=(totalScore/totalCredit).toFixed(2)+' 分';
  else el.textContent='请输入有效数据（格式：学分×成绩）';
}
</script>
